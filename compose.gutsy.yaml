services:
  gutsy:
    build:
      context: .
      dockerfile: integrations/gutsy/Dockerfile
    image: gutsy-server:local
    ports:
      - "127.0.0.1:8009:8009"
    volumes:
      - ./.cache/gutsy/models:/models:ro
    cpus: 4
    mem_limit: 4g
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8009/health',timeout=5).close()"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 180s
  gutsy-mcp:
    build: .
    image: kev-decision-mcp:local
    ports:
      - "${KEV_MCP_BIND_HOST:-127.0.0.1}:${GUTSY_MCP_PORT:-8766}:8765"
    environment:
      KEV_API_BASE_URL: http://gutsy:8009
      KEV_BACKEND: gutsy
      KEV_API_MODEL: gutsy-0.8b-v04
      KEV_MCP_AUTH_TOKEN: "${KEV_MCP_AUTH_TOKEN:-}"
      KEV_MCP_ALLOWED_HOSTS: "${GUTSY_MCP_ALLOWED_HOSTS:-192.168.5.157:8766,localhost:8766,127.0.0.1:8766,localhost:8765,127.0.0.1:8765}"
    depends_on:
      gutsy:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
