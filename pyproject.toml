[project]
name = "kev-mcp-server"
version = "0.1.0"
description = "FastMCP tools for the Kev pointer-head decision model API"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
kev-mcp-server = "kev_mcp_server.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kev_mcp_server"]
