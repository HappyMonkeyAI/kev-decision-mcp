services:
  mcp:
    environment:
      KEV_API_BASE_URL: http://kev:8008
    depends_on:
      kev:
        condition: service_healthy
  kev:
    image: kev-server:local
    environment:
      KEV_RUN: "${KEV_RUN:-jaredpalmer/kev-4b@139fdd94f1b6a6ad80cc15e08fcb99cac885a101}"
      KEV_HOST: 0.0.0.0
      KEV_PORT: 8008
      KEV_API_KEY: "${KEV_API_KEY:?Set KEV_API_KEY in .env}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
    ports:
      - "127.0.0.1:${KEV_PORT:-8008}:8008"
    volumes:
      - kev-hf-cache:/root/.cache/huggingface
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://localhost:8008/v1/models',headers={'Authorization':'Bearer '+os.environ['KEV_API_KEY']}); urllib.request.urlopen(r,timeout=5).close()"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 300s
volumes:
  kev-hf-cache:
    external: true
    name: "${KEV_CACHE_VOLUME:-docker_kev-hf-cache}"
